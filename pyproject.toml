[project]
name = "dinov3-processors"
version = "0.1.0"
description = "DINOv3 feature extraction (ViT-7B / ConvNeXt-L) and projection of features onto Gaussian splats"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch>=2.7",
    "torchvision>=0.22",
    "pillow>=10.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "joblib>=1.3",
    "plyfile>=1.0",
    "safetensors>=0.4",
    "tqdm>=4.66",
    # Commonly needed by the local DINOv3 repo's hub code; remove if unused.
    "omegaconf",
    "termcolor",
    "torchmetrics",
]

[tool.uv]
# Script project, not an installable package
package = false

# --- PyTorch with CUDA (Linux/Windows). macOS falls back to the default PyPI build. ---
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true